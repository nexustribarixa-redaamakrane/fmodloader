<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="usbBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="otfLogoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DB6AC"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- USB Metal Connector (Behind Body) -->
  <rect x="100" y="24" width="56" height="50" rx="3" ry="3" fill="url(#metalGrad)" stroke="#78909C" stroke-width="1.5"/>
  
  <!-- USB Holes & Pins -->
  <rect x="110" y="34" width="10" height="12" rx="1" fill="#1C313A"/>
  <rect x="136" y="34" width="10" height="12" rx="1" fill="#1C313A"/>
  <rect x="112" y="40" width="2" height="6" fill="url(#goldGrad)"/>
  <rect x="116" y="40" width="2" height="6" fill="url(#goldGrad)"/>
  <rect x="138" y="40" width="2" height="6" fill="url(#goldGrad)"/>
  <rect x="142" y="40" width="2" height="6" fill="url(#goldGrad)"/>
  <line x1="100" y1="62" x2="156" y2="62" stroke="#90A4AE" stroke-width="1.5"/>

  <!-- USB Plastic Body -->
  <rect x="56" y="66" width="144" height="160" rx="16" ry="16" fill="url(#usbBodyGrad)" stroke="#6D0000" stroke-width="3" filter="url(#shadow)"/>

  <!-- Inner Bevel Highlight -->
  <rect x="62" y="72" width="132" height="148" rx="11" ry="11" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <path d="M 64 74 L 100 74 L 64 110 Z" fill="rgba(255,255,255,0.15)"/>

  <!-- Lanyard Loop (Bottom Center) -->
  <circle cx="128" cy="204" r="10" fill="#4A0000" stroke="#6D0000" stroke-width="2"/>
  <circle cx="128" cy="204" r="7" fill="#1A1A1A"/>

  <!-- Decorative Circuit Traces -->
  <path d="M 76 110 L 90 110 L 96 116 L 96 130" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/>
  <path d="M 180 110 L 166 110 L 160 116 L 160 130" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/>
  <path d="M 76 160 L 96 160 L 102 166 L 102 180" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/>
  <path d="M 180 160 L 160 160 L 154 166 L 154 180" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/>

  <!-- OpenType Logo Badge -->
  <circle cx="128" cy="132" r="32" fill="url(#otfLogoGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="145" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="bold" font-size="40" fill="white">O</text>
  <text x="128" y="184" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFCDD2" letter-spacing="1.5">OPENTYPE</text>

  <!-- Mod badge — small "M" circle top-right -->
  <circle cx="178" cy="84" r="16" fill="#FDD835" stroke="#F9A825" stroke-width="2"/>
  <text x="178" y="90" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="18" fill="#333">M</text>
</svg>
